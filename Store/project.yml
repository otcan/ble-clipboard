name: BLEClipboardStore
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.5.2
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ARCHS: "arm64 x86_64"
targets:
  BLEClipboardStore:
    type: application
    platform: macOS
    productName: BLE Clipboard
    sources:
      - path: ../BLEClipboardMac/Sources/BLEClipboardMac
      - path: ../BLEClipboardMac/Resources/AppIcon.icns
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../LICENSE
        buildPhase: resources
      - path: ../NOTICE
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: BLE Clipboard
        APP_DISPLAY_NAME: BLE Clipboard
        PRODUCT_MODULE_NAME: BLEClipboardMac
        PRODUCT_BUNDLE_IDENTIFIER: com.oguzcanunver.BLEClipboardMac
        CODE_SIGN_ENTITLEMENTS: Store.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_RESOURCE_ACCESS_BLUETOOTH: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.oguzcanunver.BLEClipboardMac.MacrosPreview
          APP_DISPLAY_NAME: BLE Clipboard Preview
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  BLEClipboardUnitTests:
    type: bundle.unit-test
    platform: macOS
    sources: ../BLEClipboardMac/Tests/BLEClipboardMacTests
    dependencies:
      - target: BLEClipboardStore
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.oguzcanunver.BLEClipboardMac.UnitTests
  BLEClipboardUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: UITests
    dependencies:
      - target: BLEClipboardStore
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.oguzcanunver.BLEClipboardMac.UITests
schemes:
  BLEClipboardStore:
    build:
      targets:
        BLEClipboardStore: all
    test:
      targets:
        - BLEClipboardUnitTests
        - BLEClipboardUITests
    archive:
      config: Release
