name: Macros and Store Validation

on:
  push:
    branches: [feature/independent-0.3.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test --package-path BLEClipboardMac
      - name: Independent production engine and wire contract tests
        run: sh scripts/check_clipboard.sh
      - name: Install project generator
        run: brew install xcodegen
      - name: Validate sandboxed unsigned universal archive
        run: sh scripts/archive_store.sh
      - name: Include matching project and firmware source
        run: sh scripts/package_sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: store-unsigned-validation-only
          path: |
            Store/Archives/*.xcarchive
            Store/dist/*-source.tar.gz

  clipboard-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ufbt==0.2.6
      - run: ufbt update --branch 1.5.1
      - name: Build independent BLE Clipboard for API 88.2
        run: sh scripts/build_flipper.sh
      - name: Include matching project and firmware source
        run: sh scripts/package_sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-api-88.2-development
          path: |
            BluetoothClipboard/dist/ble_clipboard.fap
            BluetoothClipboard/dist/ble-clipboard-flipper-source.tar.gz
            Store/dist/*-source.tar.gz
